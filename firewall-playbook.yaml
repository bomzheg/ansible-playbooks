- name: Firewall
  hosts: prepared
  become: true
  tasks:
    - name: Install ipset
      ansible.builtin.apt:
        name: ipset
        state: present
        update_cache: true

    - name: Create RU networks ipset
      ansible.builtin.command:
        cmd: ipset create ru_networks hash:net
      register: ipset_result
      failed_when:
        - ipset_result.rc != 0
        - "'already exists' not in ipset_result.stderr"
      changed_when: ipset_result.rc == 0

    - name: Add RU networks to ipset
      ansible.builtin.command:
        cmd: "ipset add ru_networks {{ item }}"
      loop: "{{ lookup('file', 'resources/ru_networks.txt').splitlines() }}"
      when: item | trim | length > 0

    - name: Block forwarded connections to RU
      ansible.builtin.iptables:
        chain: FORWARD
        match_set: ru_networks
        match_set_flags: dst
        jump: DROP

    - name: Allow established forwarded connections
      ansible.builtin.iptables:
        chain: FORWARD
        ctstate: ESTABLISHED,RELATED
        jump: ACCEPT

    - name: Allow output
      ansible.builtin.iptables:
        chain: OUTPUT
        jump: ACCEPT

    - name: Allow ssh and https
      ansible.builtin.iptables:
        chain: INPUT
        destination_ports:
          - "22"
          - "80"
          - "443"
        protocol: tcp
        jump: ACCEPT

    - name: Allow established
      ansible.builtin.iptables:
        chain: INPUT
        ctstate: ESTABLISHED,RELATED
        jump: ACCEPT

    - name: Allow docker
      ansible.builtin.iptables:
        chain: INPUT
        in_interface: docker0
        jump: ACCEPT

    - name: Allow established docker
      ansible.builtin.iptables:
        chain: DOCKER-USER
        ctstate: ESTABLISHED,RELATED
        jump: ACCEPT

    - name: Allow docker bridge
      ansible.builtin.iptables:
        chain: INPUT
        in_interface: br+
        protocol: tcp
        destination_ports:
          - "5432"
          - "6379"
        jump: ACCEPT

    - name: Allow lo
      ansible.builtin.iptables:
        chain: INPUT
        in_interface: lo
        jump: ACCEPT

    - name: Block any other ports
      ansible.builtin.iptables:
        chain: INPUT
        jump: DROP
