---
- name: Backup VPS databases, files and monitoring
  hosts: prepared
  become: true
  gather_facts: true

  vars:
    backup_timestamp: "{{ ansible_date_time.iso8601_basic_short }}"

    backup_local_dir: "./backups"
    backup_remote_prefix: "/tmp/vps-backup"

    postgres_user: postgres

    databases:
      - karmabot
      - shvatka
      - changebot

    shvatka_files: /home/bomzheg/projects/Shvatka/files

    # Grafana
    grafana_service: grafana-server
    grafana_data_dir: /var/lib/grafana
    grafana_config_dir: /etc/grafana

    # VictoriaMetrics
    victoria_metrics_version: "v1.93.5"
    victoria_metrics_archive: "vmutils-linux-amd64-{{ victoria_metrics_version }}.tar.gz"
    victoria_metrics_download_url: >-
      https://github.com/VictoriaMetrics/VictoriaMetrics/releases/download/{{ victoria_metrics_version }}/{{ victoria_metrics_archive }}

    victoria_metrics_storage: /var/lib/victoria-metrics
    victoria_metrics_user: victoriametrics
    victoria_metrics_snapshot_url: http://localhost:8428/snapshot/create
    victoria_metrics_backup_binary: /usr/local/bin/vmbackup-prod

  tasks:
    - name: Create local backup directory
      ansible.builtin.file:
        path: "{{ backup_local_dir }}"
        state: directory
        mode: "0755"
      delegate_to: localhost
      become: false

    - name: Create temporary remote directory
      ansible.builtin.tempfile:
        state: directory
        path: /tmp
        prefix: vps-backup-
      register: backup_temp

    - name: Make temporary directory accessible
      ansible.builtin.file:
        path: "{{ backup_temp.path }}"
        mode: "0755"

    - name: Prepare and download backup
      block:

        - name: Create database dump directories
          ansible.builtin.file:
            path: "{{ backup_temp.path }}/{{ item }}"
            state: directory
            owner: "{{ postgres_user }}"
            mode: "0700"
          loop: "{{ databases }}"

        - name: Dump PostgreSQL databases
          ansible.builtin.shell:
            cmd: |
              runuser -u postgres -- pg_dump \
                -f '{{ backup_temp.path }}/{{ item }}/' \
                -U postgres \
                -F d \
                --no-owner \
                --no-privileges \
                -d '{{ item }}'
          loop: "{{ databases }}"
          loop_control:
            label: "{{ item }}"

        - name: Include Shvatka files
          ansible.builtin.command:
            argv:
              - cp
              - -a
              - "{{ shvatka_files }}"
              - "{{ backup_temp.path }}/files"

        - name: Create Grafana backup directories
          ansible.builtin.file:
            path: "{{ backup_temp.path }}/grafana/{{ item }}"
            state: directory
            mode: "0700"
          loop:
            - data
            - etc

        - name: Stop Grafana before backing up SQLite database
          ansible.builtin.service:
            name: "{{ grafana_service }}"
            state: stopped

        - name: Backup Grafana
          block:

            - name: Copy Grafana data directory
              ansible.builtin.command:
                argv:
                  - cp
                  - -a
                  - "{{ grafana_data_dir }}/."
                  - "{{ backup_temp.path }}/grafana/data/"

            - name: Copy Grafana configuration
              ansible.builtin.command:
                argv:
                  - cp
                  - -a
                  - "{{ grafana_config_dir }}/."
                  - "{{ backup_temp.path }}/grafana/etc/"

          always:

            - name: Start Grafana after backup
              ansible.builtin.service:
                name: "{{ grafana_service }}"
                state: started

        - name: Download VictoriaMetrics utilities
          ansible.builtin.get_url:
            url: "{{ victoria_metrics_download_url }}"
            dest: "{{ backup_temp.path }}/{{ victoria_metrics_archive }}"
            mode: "0644"

        - name: Create VictoriaMetrics utilities extraction directory
          ansible.builtin.file:
            path: "{{ backup_temp.path }}/vmutils"
            state: directory
            mode: "0755"

        - name: Extract VictoriaMetrics utilities
          ansible.builtin.unarchive:
            src: "{{ backup_temp.path }}/{{ victoria_metrics_archive }}"
            dest: "{{ backup_temp.path }}/vmutils"
            remote_src: true

        - name: Install vmbackup-prod
          ansible.builtin.copy:
            src: "{{ backup_temp.path }}/vmutils/vmbackup-prod"
            dest: "{{ victoria_metrics_backup_binary }}"
            remote_src: true
            owner: root
            group: root
            mode: "0755"

        - name: Create VictoriaMetrics backup directory
          ansible.builtin.file:
            path: "{{ backup_temp.path }}/victoria-metrics"
            state: directory
            owner: "{{ victoria_metrics_user }}"
            group: "{{ victoria_metrics_user }}"
            mode: "0700"

        - name: Backup VictoriaMetrics using snapshot
          ansible.builtin.command:
            argv:
              - runuser
              - -u
              - "{{ victoria_metrics_user }}"
              - --
              - "{{ victoria_metrics_backup_binary }}"
              - "-storageDataPath={{ victoria_metrics_storage }}"
              - "-snapshot.createURL={{ victoria_metrics_snapshot_url }}"
              - "-dst=fs://{{ backup_temp.path }}/victoria-metrics"

        - name: Create compressed archive
          ansible.builtin.command:
            argv:
              - tar
              - -czf
              - "{{ backup_temp.path }}.tar.gz"
              - -C
              - "{{ backup_temp.path }}"
              - karmabot
              - shvatka
              - changebot
              - files
              - grafana
              - victoria-metrics

        - name: Download archive to Ansible controller
          ansible.builtin.fetch:
            src: "{{ backup_temp.path }}.tar.gz"
            dest: "{{ backup_local_dir }}/backup-{{ backup_timestamp }}.tar.gz"
            flat: true

      always:

        - name: Remove temporary remote directory
          ansible.builtin.file:
            path: "{{ backup_temp.path }}"
            state: absent

        - name: Remove remote archive
          ansible.builtin.file:
            path: "{{ backup_temp.path }}.tar.gz"
            state: absent
